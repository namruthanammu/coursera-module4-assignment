<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaapi Corner – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Source+Serif+4:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9efe9;
    --ink: #12332b;
    --muted: #4f6b62;
    --accent: #e8b931;
    --card: #f7faf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    line-height: 1.6;
  }
  header {
    background: var(--ink);
    color: var(--bg);
    padding: 64px 24px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(3rem, 12vw, 6rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }
  header p { margin-top: 16px; font-style: italic; color: #b9ccc3; max-width: 46ch; }
  .tabs {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 2px solid var(--ink);
  }
  .tabs .wrap { display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px; }
  .tab {
    font: 500 1rem "Bricolage Grotesque", system-ui, sans-serif;
    background: none; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 18px; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-pressed="true"] { background: var(--accent); }
  .tab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  main { padding: 32px 24px 64px; }
  .item { padding: 18px 0; border-bottom: 1px solid #c3d1c8; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .name { font: 800 1.25rem "Bricolage Grotesque", system-ui, sans-serif; }
  .dots { flex: 1; border-bottom: 2px dotted #9fb5aa; transform: translateY(-4px); }
  .price { font: 500 1.15rem "Bricolage Grotesque", system-ui, sans-serif; }
  .desc { color: var(--muted); max-width: 52ch; }
  .tag {
    display: inline-block; margin-left: 8px;
    background: var(--accent); border-radius: 6px;
    padding: 0 8px; font-size: 0.8rem;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
  }
  footer { background: var(--card); border-top: 2px solid var(--ink); padding: 32px 24px; }
  footer p { max-width: 52ch; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Kaapi Corner</h1>
    <p>Filter coffee, fresh bakes and all-day breakfast. Open 8 am to 10 pm, every day.</p>
  </div>
</header>

<nav class="tabs" aria-label="Menu categories">
  <div class="wrap" id="tabs"></div>
</nav>

<main>
  <div class="wrap" id="menu"></div>
</main>

<footer>
  <div class="wrap">
    <p>Prices are in rupees and include tax. Tell us about any allergies before you order.</p>
  </div>
</footer>

<script>
  // Edit this list to change the menu.
  const menu = [
    { cat: "Coffee", name: "Filter coffee", price: 60, desc: "South Indian decoction, hot milk, brass tumbler.", tag: "Bestseller" },
    { cat: "Coffee", name: "Cappuccino", price: 140, desc: "Double shot with steamed milk and thick foam." },
    { cat: "Coffee", name: "Cold brew", price: 160, desc: "Steeped for 18 hours, served over ice." },
    { cat: "Coffee", name: "Mocha", price: 170, desc: "Espresso, dark chocolate and milk." },
    { cat: "Tea & more", name: "Masala chai", price: 50, desc: "Ginger, cardamom and strong Assam leaf." },
    { cat: "Tea & more", name: "Iced lemon tea", price: 110, desc: "Black tea, lemon and mint." },
    { cat: "Tea & more", name: "Hot chocolate", price: 150, desc: "Melted dark chocolate and steamed milk." },
    { cat: "Breakfast", name: "Masala dosa", price: 120, desc: "Crisp dosa, potato palya, coconut chutney.", tag: "Veg" },
    { cat: "Breakfast", name: "Idli vada", price: 90, desc: "Two idlis, one vada, sambar and chutney.", tag: "Veg" },
    { cat: "Breakfast", name: "Egg toast", price: 130, desc: "Scrambled eggs on buttered sourdough." },
    { cat: "Bakes", name: "Butter croissant", price: 95, desc: "Baked every morning." },
    { cat: "Bakes", name: "Banana walnut cake", price: 120, desc: "A thick slice with a coffee glaze.", tag: "Veg" },
    { cat: "Bakes", name: "Chocolate brownie", price: 110, desc: "Fudgy centre, crisp top." }
  ];

  const cats = ["All", ...new Set(menu.map(i => i.cat))];
  const tabsEl = document.getElementById("tabs");
  const menuEl = document.getElementById("menu");
  let active = "All";

  function render() {
    tabsEl.innerHTML = cats.map(c =>
      `<button class="tab" aria-pressed="${c === active}" data-cat="${c}">${c}</button>`
    ).join("");

    const items = menu.filter(i => active === "All" || i.cat === active);
    menuEl.innerHTML = items.map(i => `
      <article class="item">
        <div class="row">
          <span class="name">${i.name}${i.tag ? `<span class="tag">${i.tag}</span>` : ""}</span>
          <span class="dots"></span>
          <span class="price">₹${i.price}</span>
        </div>
        <p class="desc">${i.desc}</p>
      </article>`).join("");
  }

  tabsEl.addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    active = btn.dataset.cat;
    render();
    tabsEl.querySelector(`[data-cat="${active}"]`).focus();
  });

  render();
</script>
</body>
</html>
